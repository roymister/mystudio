<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Polos, tazas, accesorios y regalos sublimados personalizados."><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>M&amp;Y Studio · Sublimación y personalizados</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"><style id="css">/* Layout: tienda de una página — barra superior, cabecera con búsqueda, navegación, vistas por categoría, pie oscuro */
:root{
  --navy:#1E2638; --ink:#1B2232; --primary:#3B3FD8; --primary-dk:#2D30B5; --cyan:#3DD0F0; --cyan-ink:#06303A;
  --pink:#E2457A; --pink-soft:#FDE4EC; --sky-soft:#E6F2FD; --sky-ink:#1F6FB2;
  --bg:#FFFFFF; --soft:#F4F6FB; --line:#E2E6EF; --fg:#1B2232; --muted:#667085; --foot-fg:#C6CDDB;
  --f-display:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-body:"Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}

/* barra superior */
.topbar{background:var(--navy);color:#fff;font-size:11.5px;position:relative}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--cyan),var(--primary),var(--pink))}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:7px;flex-wrap:wrap}
.topbar .tb-r{display:flex;gap:18px;flex-wrap:wrap}
.topbar b{font-weight:700}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cyan);margin-right:6px;vertical-align:1px}

/* cabecera */
.head{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.head .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.logo{display:flex;flex-direction:column;line-height:1;text-decoration:none;flex:none}
.logo b{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--ink)}
.logo b span{color:var(--primary)}
.logo small{font-size:9.5px;font-weight:700;letter-spacing:.14em;color:var(--cyan);margin-top:3px;filter:brightness(.8)}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 5px 5px 14px;min-width:0;max-width:560px;margin-inline:auto}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--fg);outline:none}
.search button{border:0;background:var(--primary);color:#fff;font-weight:700;font-size:12.5px;border-radius:999px;padding:7px 16px;cursor:pointer}
.hd-actions{display:flex;align-items:center;gap:10px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:12.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
.pill.soft{background:#E9EDF8;color:var(--ink)}
.pill.wa{background:var(--cyan);color:var(--cyan-ink)}
.cartbtn{position:relative;display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;cursor:pointer;padding:6px;color:var(--ink);font:inherit;font-weight:700;font-size:12.5px}
.cartbtn .badge{position:absolute;top:-2px;right:-4px;background:var(--pink);color:#fff;font-size:10px;font-weight:800;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
@media (max-width:860px){.head .wrap{flex-wrap:wrap}.search{order:3;flex-basis:100%;max-width:none}.pill .lbl,.cartbtn .lbl{display:none}.hd-actions{margin-left:auto}}

/* navegación */
.nav{background:var(--soft);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
.nav{position:relative;z-index:20}
.nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.nav ul>li>a,.nav-dd>button{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:0;background:none;font:inherit;text-decoration:none;font-weight:600;font-size:13px;color:#3A4358;white-space:nowrap;cursor:pointer}
.nav ul>li>a[aria-current="page"],.nav-dd>button.on{background:#fff;color:var(--primary);box-shadow:0 1px 0 var(--line)}
.nav ul>li>a:hover,.nav-dd>button:hover,.nav-dd.open>button{color:var(--primary)}
.nav-dd{position:relative}
.caret{font-size:10px;opacity:.6;transition:transform .15s}
.nav-dd.open .caret{transform:rotate(180deg)}
.nav-panel{display:none;position:absolute;top:100%;left:0;min-width:220px;padding:6px;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(20,25,45,.12)}
.nav-panel::before{content:"";position:absolute;left:0;right:0;top:-8px;height:8px}
.nav-dd.open .nav-panel{display:block}
.nav-panel a{display:block;padding:8px 12px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:500;color:#3A4358;white-space:nowrap}
.nav-panel a:hover,.nav-panel a[aria-current="page"]{background:var(--soft);color:var(--primary)}
.nav-panel a.sep{font-weight:700;border-bottom:1px solid var(--line);border-radius:8px 8px 0 0;margin-bottom:4px}
.tags{display:flex;gap:8px;flex:none}
.tag{font-size:11px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.tag.sky{background:var(--sky-soft);color:var(--sky-ink)}
.tag.pink{background:var(--pink-soft);color:var(--pink)}
@media (max-width:1500px){.tags{display:none}}

main{min-height:50vh}
.section{padding-block:36px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,3.4vw,38px);font-weight:800;line-height:1.1}
h2{font-size:clamp(20px,2.4vw,26px);font-weight:800}
h3{font-size:15px;font-weight:700}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--primary)}
.lead{color:var(--muted);max-width:62ch;margin:6px 0 0}
.link{color:var(--primary);font-weight:700;text-decoration:none;font-size:13px}

/* carrusel */
.hero{padding-top:20px}
.carousel{position:relative;border-radius:18px;overflow:hidden;background:var(--navy)}
.track{display:flex;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.slide{flex:0 0 100%;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:20px;padding:40px clamp(20px,5vw,56px);min-height:340px;color:#fff;position:relative}
.slide .txt{position:relative;z-index:1;display:flex;flex-direction:column;gap:14px;align-items:flex-start;min-width:0}
.slide h1{color:#fff}
.slide p{color:#C9D2E6;margin:0;max-width:46ch}
.slide .art{position:relative;z-index:1;display:flex;justify-content:center}
.slide .art svg{width:min(100%,360px);height:auto}
.slide .kicker{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.cta{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--ink);border:0;border-radius:999px;padding:11px 20px;font-weight:800;font-size:13.5px;text-decoration:none;cursor:pointer}
.cta.primary{background:var(--primary);color:#fff}
.cta.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}
.slide .ctas{display:flex;gap:10px;flex-wrap:wrap}
.car-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:2;border:0;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:18px;cursor:pointer;backdrop-filter:blur(4px)}
.car-btn.prev{left:12px}.car-btn.next{right:12px}
.dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:8px;z-index:2}
.dots button{width:9px;height:9px;border-radius:999px;border:0;background:rgba(255,255,255,.35);cursor:pointer;padding:0;transition:width .3s}
.dots button[aria-current="true"]{width:26px;background:#fff}
@media (max-width:760px){.slide{grid-template-columns:1fr;padding-bottom:48px;text-align:left}.slide .art svg{width:min(70%,240px)}.car-btn{display:none}}

/* categorías */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:860px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cat{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);border-radius:14px;text-decoration:none;background:#fff;transition:border-color .2s, transform .2s}
.cat:hover{border-color:var(--primary);transform:translateY(-2px)}
.cat .ph{background:var(--soft);border-radius:10px;aspect-ratio:4/3;display:grid;place-items:center}
.cat .ph svg{width:62%;height:auto}
.cat small{color:var(--muted)}

/* productos */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
@media (min-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;min-width:0}
.card .ph{background:var(--soft);aspect-ratio:1;display:grid;place-items:center;position:relative}
.card .ph svg{width:70%;height:auto}
.card .ribbon{position:absolute;top:10px;left:10px}
.card .body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card p{margin:0;color:var(--muted);font-size:12.5px}
.price{font-family:var(--f-display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.price small{font-size:11px;color:var(--muted);font-weight:600;font-family:var(--f-body)}
.card .cfoot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dk)}
.btn.wa{background:var(--cyan);border-color:var(--cyan);color:var(--cyan-ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* beneficios y pasos */
.perks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:860px){.perks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.perk{background:var(--soft);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.perk .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#fff;color:var(--primary);margin-bottom:6px}
.perk p{margin:0;color:var(--muted);font-size:12.5px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;counter-reset:s}
@media (max-width:760px){.steps{grid-template-columns:1fr}}
.step{border:1px solid var(--line);border-radius:14px;padding:18px;position:relative}
.step b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;font-size:13px;margin-bottom:8px}
.step p{margin:4px 0 0;color:var(--muted);font-size:13px}
.bulk{background:linear-gradient(120deg,var(--navy),#2B2F7A);color:#fff;border-radius:18px;padding:28px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.bulk h2{color:#fff}.bulk p{color:#C9D2E6;margin:6px 0 0}
.tiers{display:flex;gap:10px;flex-wrap:wrap}
.tier{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 14px;text-align:center}
.tier b{display:block;font-family:var(--f-display);font-size:20px;color:var(--cyan)}
.tier span{font-size:11.5px;color:#C9D2E6}

/* página de categoría */
.page-head{background:var(--soft);border-bottom:1px solid var(--line)}
.page-head .wrap{padding-block:26px;display:flex;flex-direction:column;gap:6px}
.crumbs{font-size:12px;color:var(--muted)}
.crumbs a{text-decoration:none}

/* simulador incrustado */
.sim{--bg:#F4F6FB;--panel:#FFFFFF;--fg:#1B2232;--muted:#667085;--line:#E2E6EF;--accent:#3B3FD8;--accent-ink:#FFFFFF;--magenta:#E2457A;--warn-bg:#FFF4DB;--warn-fg:#7A5300;--stage:#E9EDF5;--f-display:var(--f-display);--f-body:var(--f-body)}
.sim-wrap{display:flex;flex-direction:column;gap:14px}
.buybar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff;box-shadow:0 6px 20px rgba(27,34,50,.06)}
.buybar .opts{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.sizes{display:flex;gap:4px}
.sizes button{border:1px solid var(--line);background:#fff;border-radius:8px;min-width:38px;padding:6px 8px;font-weight:700;cursor:pointer}
.sizes button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{border:0;background:var(--soft);width:32px;height:34px;font-size:16px;cursor:pointer;color:var(--ink)}
.qty input{width:44px;border:0;text-align:center;font:700 14px var(--f-body);color:var(--fg);background:#fff;-moz-appearance:textfield}
.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.total{font-family:var(--f-display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.total small{display:block;font:600 11.5px var(--f-body);color:var(--muted)}

/* modal producto */
.overlay{position:fixed;inset:0;background:rgba(17,22,35,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:18px;max-width:880px;width:100%;max-height:calc(100vh - 32px);overflow:auto;display:grid;grid-template-columns:1fr 1fr}
@media (max-width:760px){.modal{grid-template-columns:1fr}}
.modal .ph{background:var(--soft);display:grid;place-items:center;padding:24px;position:relative;min-height:280px}
.modal .ph svg{width:min(100%,320px);height:auto}
.modal .info{padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.x{position:absolute;top:10px;right:10px;border:0;background:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:600;font-size:12.5px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.drop{display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--line);border-radius:12px;padding:14px;cursor:pointer;font-weight:700;color:var(--primary);text-align:center}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
textarea,select,.input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:14px var(--f-body);color:var(--fg);background:#fff}
textarea{resize:vertical;min-height:64px}

/* carrito */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:#fff;z-index:70;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.15);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer .items{flex:1;overflow:auto;padding:12px 18px;display:flex;flex-direction:column;gap:12px}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:start}
.item .th{width:64px;height:64px;border-radius:10px;background:var(--soft);display:grid;place-items:center;overflow:hidden}
.item .th img,.item .th svg{width:100%;height:100%;object-fit:contain}
.item h4{margin:0;font-size:13.5px}
.item small{color:var(--muted);display:block;font-size:11.5px;line-height:1.4}
.item .rm{border:0;background:none;color:var(--pink);font-weight:700;font-size:12px;cursor:pointer;padding:0}
.sum{border-top:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.sum .ln{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.sum .ln.big{font-family:var(--f-display);font-weight:800;font-size:18px}
.sum .ln.off{color:#15803D;font-weight:600}
.empty-cart{color:var(--muted);text-align:center;padding:40px 10px}

/* cotizador */
.quote{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
@media (max-width:860px){.quote{grid-template-columns:1fr}}
.box{border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;background:#fff;min-width:0}
.box.dark{background:var(--navy);color:#fff;border-color:var(--navy)}
.box.dark .ln{display:flex;justify-content:space-between;color:#C9D2E6;font-variant-numeric:tabular-nums}
.box.dark .ln.big{color:#fff;font-family:var(--f-display);font-size:24px;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:13px;z-index:80}
.note-cfg{font-size:12px;color:var(--muted)}

/* pie */
.foot{background:var(--navy);color:var(--foot-fg);margin-top:40px;position:relative}
.foot::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--pink),var(--primary),var(--cyan))}
.foot .wrap{padding-block:34px 20px}
.fcols{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:28px}
@media (max-width:760px){.fcols{grid-template-columns:1fr}}
.foot .logo b{color:#fff}
.foot h4{color:#fff;font-family:var(--f-display);font-size:14px;margin:0 0 10px}
.foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.foot ul a{text-decoration:none;color:var(--cyan);filter:brightness(1.05)}
.foot p{font-size:12.5px;max-width:44ch}
.fbadges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fbadge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border-radius:8px;padding:7px 10px;font-size:11.5px;font-weight:700;color:#fff}
.fbottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.08);margin-top:24px;padding-top:14px;font-size:11.5px}
.fbottom .pay{display:flex;gap:8px;align-items:center}
.fbottom .pay span{background:rgba(255,255,255,.08);border-radius:6px;padding:3px 8px;color:#fff;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ilustraciones */
.art-svg{display:contents}
.cats{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1000px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* carrusel en movimiento */
.marquee{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);padding-block:4px 8px}
.mq-track{display:flex;width:max-content;animation:mq 90s linear infinite}
.marquee:hover .mq-track,.marquee:focus-within .mq-track{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.mq-item{flex:none;width:170px;margin-right:14px;display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px;cursor:pointer;color:var(--fg);transition:border-color .2s, transform .2s}
.mq-item:hover{border-color:var(--primary);transform:translateY(-2px)}

function textCanvas(t){
  const f="800 180px 'Bricolage Grotesque',sans-serif";const m=cv(1,1,()=>{});const mx=m.getContext("2d");mx.font=f;
  const w=Math.ceil(mx.measureText(t).width)+60;

    x.strokeStyle="#FFFFFF";x.strokeText(t,w/2,125);x.fillStyle="#141414";x.fillText(t,w/2,125);});
}



/* ---------- Capas como calcomanías proyectadas sobre la tela ---------- */
let layers=[], selId=null, nid=1, mode="girar";
const helper=new THREE.Object3D();
function layerCanvas(L){ // imagen + borde de selección
  const pad=Math.round(Math.max(L.img.width,L.img.height)*0.04), c=L.canvas||(L.canvas=document.createElement("canvas"));
  c.width=L.img.width+pad*2; c.height=L.img.height+pad*2; const x=c.getContext("2d");
  x.clearRect(0,0,c.width,c.height); x.drawImage(L.img,pad,pad);
  if(L.id===selId&&mode==="colocar"){x.strokeStyle="#C81D6B";x.lineWidth=Math.max(3,pad*0.35);x.setLineDash([pad*1.2,pad*0.8]);x.strokeRect(pad*0.4,pad*0.4,c.width-pad*0.8,c.height-pad*0.8);}
  if(!L.tex){L.tex=new THREE.CanvasTexture(c);L.tex.encoding=THREE.sRGBEncoding;L.tex.anisotropy=renderer.capabilities.getMaxAnisotropy();}
  L.tex.needsUpdate=true; L.padF=c.width/L.img.width;
}
// quita triángulos casi de perfil a la proyección (evitan manchas estiradas en costados y pliegues)
function cleanDecal(geo,dir){
  const p=geo.attributes.position, n=geo.attributes.normal, uv=geo.attributes.uv, keep=[];
  const a=new THREE.Vector3(),b=new THREE.Vector3(),c=new THREE.Vector3(),fn=new THREE.Vector3();
  for(let i=0;i<p.count;i+=3){
    a.fromBufferAttribute(p,i);b.fromBufferAttribute(p,i+1);c.fromBufferAttribute(p,i+2);
    fn.subVectors(c,b).cross(a.clone().sub(b)).normalize();
    const dd=fn.dot(dir); if(KIND==="taza" ? dd>0.3 : Math.abs(dd)>0.3) keep.push(i);
  }
  if(!keep.length){geo.dispose();return null;}
  const P=new Float32Array(keep.length*9),N=new Float32Array(keep.length*9),U=new Float32Array(keep.length*6);
  keep.forEach((i,k)=>{for(let j=0;j<3;j++){for(let q=0;q<3;q++){P[k*9+j*3+q]=p.array[(i+j)*3+q];N[k*9+j*3+q]=n.array[(i+j)*3+q];}U[k*6+j*2]=uv.array[(i+j)*2];U[k*6+j*2+1]=uv.array[(i+j)*2+1];}});
  geo.dispose(); const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(P,3));g.setAttribute("normal",new THREE.BufferAttribute(N,3));g.setAttribute("uv",new THREE.BufferAttribute(U,2));
  return g;
}
// dirección de proyección = promedio de la superficie bajo todo el diseño (no solo el punto central)
const avgRay=new THREE.Raycaster();
function avgNormal(p,n,w,h){
  const t=new THREE.Vector3(0,1,0).cross(n); if(t.lengthSq()<1e-4) t.set(1,0,0); t.normalize();
  const b=new THREE.Vector3().crossVectors(n,t).normalize(), acc=n.clone(), dir=n.clone().negate();
  [[-.4,0],[.4,0],[0,-.4],[0,.4],[-.3,-.3],[.3,.3],[-.3,.3],[.3,-.3]].forEach(([x,y])=>{
    const o=p.clone().addScaledVector(t,x*w).addScaledVector(b,y*h).addScaledVector(n,0.25);
    avgRay.set(o,dir); const hh=avgRay.intersectObjects(fabricMeshes,false)[0];
    if(hh&&hh.distance<0.45){const q=hh.face.normal.clone().transformDirection(hh.object.matrixWorld);if(q.dot(n)<0)q.negate();acc.add(q);}
  });
  return acc.normalize();
}
function buildDecal(L){
  if(L.group){shirt.remove(L.group);L.group.traverse(o=>{if(o.geometry)o.geometry.dispose();});}
  if(!L.point) return;
  layerCanvas(L);
  if(!L.mat) L.mat=new THREE.MeshStandardMaterial({map:L.tex,transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-4,roughness:0.9,metalness:0,side:THREE.DoubleSide,envMapIntensity:0.6});
  const h=L.s*L.padF, w=L.s*L.asp*L.padF, d=K.flat?0.05:KIND==="taza"?Math.max(w,h)*0.9:Math.min(0.1,Math.max(w,h)*0.5);
  const N=avgNormal(L.point,L.normal,w,h);
  helper.position.copy(L.point); if(Math.abs(N.y)>0.9) helper.up.set(0,0,-1); else helper.up.set(0,1,0);
  helper.lookAt(L.point.clone().add(N)); helper.rotateZ(-L.rot*Math.PI/180);
  const size=new THREE.Vector3(w,h,d), g=new THREE.Group(), r=Math.max(w,h);
  fabricMeshes.forEach(m=>{
    if(!m.userData.box) m.userData.box=new THREE.Box3().setFromObject(m);
    if(m.userData.box.distanceToPoint(L.point)>r) return;
    const geo=cleanDecal(new THREE.DecalGeometry(m,L.point,helper.rotation,size),N);
    if(geo) g.add(new THREE.Mesh(geo,L.mat));
  });

}
function sel(){return layers.find(l=>l.id===selId);}
function hitFrom(origin,dir){const r=new THREE.Raycaster(origin,dir.normalize());const h=r.intersectObjects(fabricMeshes,false)[0];return h&&setHit(h,dir);}
function setHit(h,dir){const n=h.face.normal.clone().transformDirection(h.object.matrixWorld);if(n.dot(dir)>0)n.negate();return{point:h.point.clone(),normal:n};}
function addLayer(name,img,opt={}){
  const asp=img.width/img.height;
  const L={id:nid++,name,img,asp,s:opt.s||(K.flat?(asp>2?0.08:0.2):KIND==="taza"?(asp>2?0.16:0.5):(asp>2?0.07:0.22)),rot:0,thumb:img.toDataURL?img.toDataURL():img.src};
  const hit=K.flat ? hitFrom(new THREE.Vector3(opt.x||0,2,opt.z||0),new THREE.Vector3(0,-1,0))
                   : hitFrom(new THREE.Vector3(opt.x||0,opt.y||0.6,opt.back?-2:2),new THREE.Vector3(0,0,opt.back?1:-1));
  if(hit){L.point=hit.point;L.normal=hit.normal;}
  layers.push(L); if(!opt.keepSel){selId=L.id; setMode("colocar");}
  buildDecal(L); refresh();
}
function where(l){ if(!l.point) return "";
  if(K.flat){ const x=l.point.x; return x<-0.17?"Lado izquierdo":x>0.17?"Lado derecho":"Centro"; }
  if(KIND==="taza") return l.normal.z>0.35?"Frente":l.normal.z<-0.35?"Atrás":l.normal.x>0?"Lado del asa":"Lado opuesto al asa";
  const p=l.point; if(Math.abs(p.x)>bodyHalfW*0.72&&p.y>0.62) return p.x>0?"Manga izquierda":"Manga derecha";
  if(l.normal.z>0.35) return p.y>0.65?"Pecho":"Frente"; if(l.normal.z<-0.35) return "Espalda"; return "Costado"; }
const cm=l=>`${Math.round(l.s*l.asp*H_CM)} × ${Math.round(l.s*H_CM)} cm`;
function refresh(){
  const ul=$("layers");ul.innerHTML="";
  if(!layers.length) ul.innerHTML='<li><p class="empty">Aún no hay diseños. Elige uno arriba.</p></li>';
  layers.forEach(l=>{const li=document.createElement("li"),b=document.createElement("button");
    b.setAttribute("aria-pressed",l.id===selId);b.innerHTML=`<img alt="" src="${l.thumb}"><span><strong></strong><small>${where(l)} · ${cm(l)}</small></span>`;
    b.querySelector("strong").textContent=l.name;b.onclick=()=>{selId=l.id;layers.forEach(layerCanvas);refresh();};li.appendChild(b);ul.appendChild(li);});
  const s=sel();$("ctrl").hidden=!s;
  if(s){$("size").value=s.s;$("rot").value=s.rot;$("sizeOut").textContent=cm(s);$("rotOut").textContent=s.rot+"°";}
}
let pending=null;
function schedule(L){pending=L;}
$("size").min="0.03"; $("size").max=KIND==="taza"?"0.95":"0.6";
$("size").oninput=e=>{const s=sel();if(s){s.s=+e.target.value;schedule(s);$("sizeOut").textContent=cm(s);}};
$("size").onchange=()=>refresh();
$("rot").oninput=e=>{const s=sel();if(s){s.rot=+e.target.value;schedule(s);$("rotOut").textContent=s.rot+"°";}};
$("del").onclick=()=>{const s=sel();if(s&&s.group)shirt.remove(s.group);layers=layers.filter(l=>l.id!==selId);selId=layers.length?layers[layers.length-1].id:null;layers.forEach(layerCanvas);refresh();};
$("move").onclick=()=>setMode("colocar");

/* ---------- Colores ---------- */
const swWrap=$("swatches");
function setColor(hex,name){shirtColor=hex;$("colorName").textContent=name;$("customColor").value=hex.toLowerCase();
  $("warn").hidden=lum(hex)>0.55;renderPatternButtons();[...swWrap.children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.hex===hex));applyColors();}
COLORS.forEach(([n,h])=>{const b=document.createElement("button");b.className="sw";b.style.background=h;b.dataset.hex=h;b.title=n;b.setAttribute("aria-label",n);b.onclick=()=>setColor(h,n);swWrap.appendChild(b);});
$("customColor").oninput=e=>setColor(e.target.value.toUpperCase(),"Personalizado "+e.target.value.toUpperCase());
const TRIMS=[["Igual al color base",null],["Negro","#141414"],["Blanco","#FFFFFF"],["Azul marino","#1C2A4A"],["Rojo","#C8202F"],["Celeste","#5DADE2"]];
if($("trims")) TRIMS.forEach(([n,h])=>{const b=document.createElement("button");b.title=n;b.setAttribute("aria-label",n);
  if(h)b.style.background=h;else b.className="same";b.setAttribute("aria-pressed",h===trimColor);
  b.onclick=()=>{trimColor=h;[...$("trims").children].forEach(c=>c.setAttribute("aria-pressed",c===b));applyColors();};$("trims").appendChild(b);});

/* ---------- Modos y vistas ---------- */
function setMode(m){mode=m;$("mGirar").setAttribute("aria-pressed",m==="girar");$("mColocar").setAttribute("aria-pressed",m==="colocar");
  controls.enabled=m==="girar";stage.classList.toggle("placing",m==="colocar");
  if(ready) hint.textContent=m==="girar"?K.text.HINT:(sel()?K.hintPlace:"Selecciona una capa para moverla");
  if(m==="colocar"){controls.autoRotate=false;$("auto").setAttribute("aria-pressed","false");}
  layers.forEach(layerCanvas);}
$("mGirar").onclick=()=>setMode("girar");$("mColocar").onclick=()=>setMode("colocar");
let viewAnim=null;
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{
  const a=+b.dataset.view*Math.PI/180, r=Math.hypot(camera.position.x,camera.position.z);
  viewAnim={from:Math.atan2(camera.position.x,camera.position.z),to:a,r,t:0};});
$("auto").onclick=e=>{controls.autoRotate=!controls.autoRotate;e.target.setAttribute("aria-pressed",controls.autoRotate);if(controls.autoRotate)setMode("girar");};

/* ---------- Colocar con el puntero ---------- */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let dragging=false;
function placeAt(ev){const s=sel();if(!s)return;const r=renderer.domElement.getBoundingClientRect();
  ptr.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ptr,camera);
  const h=ray.intersectObjects(fabricMeshes,false)[0];if(!h)return;
  const hit=setHit(h,ray.ray.direction.clone());s.point=hit.point;s.normal=hit.normal;schedule(s);}
renderer.domElement.addEventListener("pointerdown",e=>{if(mode!=="colocar"||!ready)return;dragging=true;renderer.domElement.setPointerCapture(e.pointerId);placeAt(e);});
renderer.domElement.addEventListener("pointermove",e=>{if(dragging&&mode==="colocar")placeAt(e);});
addEventListener("pointerup",()=>{if(dragging){dragging=false;refresh();}});

/* ---------- Panel de diseños ---------- */
function initDesigns(){
  const wrap=$("designs");
  PRESETS.forEach(([n,fn])=>{const c=fn();const b=document.createElement("button");b.className="dz";b.title=n;b.setAttribute("aria-label","Agregar "+n);
    const t=document.createElement("canvas");t.width=160;t.height=160;t.getContext("2d").drawImage(c,0,0,160,160);b.appendChild(t);
    b.onclick=()=>addLayer(n,fn());wrap.appendChild(b);});
  $("addTxt").onclick=()=>{const t=$("txt").value.trim();if(t)addLayer("Texto: "+t,textCanvas(t),{y:0.7});};
  $("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{const im=new Image();im.onload=()=>{const c=cv(im.width,im.height,x=>x.drawImage(im,0,0));addLayer(f.name.replace(/\.[^.]+$/,"").slice(0,22),c);};im.src=rd.result;};
    rd.readAsDataURL(f);e.target.value="";};
  // ejemplo: logo en el pecho izquierdo, nombre y número en la espalda
  if(K.flat){
    addLayer("Montaña",PRESETS[3][1](),{x:0.28,z:0,s:0.2,keepSel:true});
    addLayer("Texto: TU NOMBRE",textCanvas("TU NOMBRE"),{x:-0.18,z:0.08,s:0.06,keepSel:true});
  } else if(KIND==="taza"){
    addLayer("Montaña",PRESETS[3][1](),{y:0.47,s:0.55,keepSel:true});
    addLayer("Texto: TU NOMBRE",textCanvas("TU NOMBRE"),{y:0.47,s:0.14,back:true,keepSel:true});
  } else {
    addLayer("Montaña",PRESETS[3][1](),{x:0.1,y:0.74,s:0.11,keepSel:true});
    addLayer("Texto: TU NOMBRE",textCanvas("TU NOMBRE"),{y:0.76,s:0.06,back:true,keepSel:true});
    addLayer("Número",PRESETS[5][1](),{y:0.5,s:0.26,back:true,keepSel:true});
  }
  selId=layers[0].id; refresh();
}

/* ---------- Loop ---------- */
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();
function loop(){if(dead)return;requestAnimationFrame(loop);
  if(pending){buildDecal(pending);pending=null;}
  if(viewAnim){viewAnim.t=Math.min(1,viewAnim.t+0.05);let d=viewAnim.to-viewAnim.from;d=Math.atan2(Math.sin(d),Math.cos(d));
    const e=1-Math.pow(1-viewAnim.t,3),a=viewAnim.from+d*e;camera.position.x=viewAnim.r*Math.sin(a);camera.position.z=viewAnim.r*Math.cos(a);
    if(viewAnim.t>=1)viewAnim=null;}
  controls.update();renderer.render(scene,camera);}
setColor("#FFFFFF","Blanco");
loop();

return {
  setSize(wcm,hcm){ if(!K.flat) return; flatCm=[wcm,hcm]; applyFlatSize(); },
  destroy(){dead=true;try{renderer.dispose();renderer.forceContextLoss();}catch(e){}},
  snapshot(){try{renderer.render(scene,camera);const c=document.createElement("canvas");const s=renderer.domElement;const k=260/Math.max(s.width,s.height);
    c.width=Math.round(s.width*k);c.height=Math.round(s.height*k);const x=c.getContext("2d");x.fillStyle="#F1F4F9";x.fillRect(0,0,c.width,c.height);x.drawImage(s,0,0,c.width,c.height);return c.toDataURL("image/jpeg",0.82);}catch(e){return null;}},
  summary(){return {color:$("colorName").textContent, full:patType!=="none", pattern:patType==="none"?null:(patType==="upload"?"Estampado propio":PATTERNS[patType].n), designs:layers.map(l=>l.name+" ("+where(l)+")")};}
};
}};

   - En Claude (página publicada): capacidades del artefacto.
   - En GitHub Pages: el Panel del dueño guarda docs/store-data.json en tu repositorio con un token de GitHub. */
const IN_CLAUDE = !!(window.claude && window.claude.use);
const GH_KEY = "sublipro-github";
function ghGuess(){
  const h=location.hostname, parts=location.pathname.split("/").filter(Boolean);
  if(h.endsWith(".github.io")){ const owner=h.split(".")[0]; return {owner, repo: parts[0] && !parts[0].includes(".") ? parts[0] : `${owner}.github.io`}; }
  return {owner:"", repo:""};
}
function ghLoad(){ try{ return JSON.parse(localStorage.getItem(GH_KEY))||null; }catch(e){ return null; } }
function ghSave(c){ try{ c?localStorage.setItem(GH_KEY,JSON.stringify(c)):localStorage.removeItem(GH_KEY); }catch(e){} }
async function gh(c, path, opt={}){
  const r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}${path}`,{...opt,headers:{Accept:"application/vnd.github+json",Authorization:`Bearer ${c.token}`,"X-GitHub-Api-Version":"2022-11-28",...(opt.headers||{})}});
  if(!r.ok){ const e=new Error("github "+r.status); e.status=r.status; try{ e.body=await r.json(); }catch(_){} throw e; }
  return r.status===204?null:r.json();
}
async function ghVerify(c){
  const info=await gh(c,"");
  if(!info.permissions || !info.permissions.push) throw Object.assign(new Error("sin permiso"),{status:403});
  return {...c, branch: c.branch || info.default_branch};
}
function toBase64(str){
  const bytes=new TextEncoder().encode(str); let bin="";
  for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(bin);
}
const GH_DATA_PATH="docs/store-data.json";
const FB = window.FireStore || null;   // Firebase (GitHub Pages). null dentro de Claude o sin conexión a Firebase
let FB_EMPTY = false;                  // true cuando Firebase aún no tiene el catálogo

/* Carga: datos incrustados en la página o archivo de datos publicado (el más reciente gana) */
async function loadPublishedData(){
  if(FB){ try{ const d=await FB.load(); if(d) return d; FB_EMPTY=true; }catch(e){ console.warn("Firebase:",e); } }
  let file=null;
  try{ const r=await fetch("store-data.json?v="+Date.now(),{cache:"no-store"}); if(r.ok) file=await r.json(); }catch(e){}
  const emb=DEFAULT_DATA;
  return file && (file.updatedAt||0) > (emb.updatedAt||0) ? file : emb;
}

function buildPage(d){
  const txt=id=>document.getElementById(id).textContent;
  const scripts=[...document.querySelectorAll("script[data-cdn]")].map(s=>`<script data-cdn src="${s.getAttribute("src")}"></`+`script>`).join("");
  const json=JSON.stringify(d).replace(/</g,"\\u003c");
  return `<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>${RESET_CSS}</style></head><body>`+
    `<title>${document.title.replace(/</g,"")}</title><meta name="claude:viewport-fit-sides" content="cover">`+
    `<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">`+
    `<style id="css">${txt("css")}</style><div id="root"></div>${scripts}`+

    `<script id="sim-src">${txt("sim-src")}</`+`script><script id="app-src">${txt("app-src")}</`+`script></body></html>`;
}
async function publishData(d){
  if(FB){
    try{ await FB.publish(d); FB_EMPTY=false; return "firebase"; }
    catch(e){ throw {code: e.code==="fb_login"||e.code==="too_large" ? e.code : e.code==="permission-denied" ? "fb_perm" : "fb_error"}; }
  }
  if(!IN_CLAUDE){
    const c=ghLoad(); if(!c||!c.token) throw {code:"gh_login"};
    let sha;
    try{ const cur=await gh(c,`/contents/${GH_DATA_PATH}?ref=${encodeURIComponent(c.branch)}`); sha=cur.sha; }catch(e){ if(e.status!==404) throw {code:e.status===401?"gh_token":"gh_error"}; }
    try{ await gh(c,`/contents/${GH_DATA_PATH}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:"Actualiza la tienda desde el Panel del dueño",content:toBase64(JSON.stringify(d,null,1)),branch:c.branch,...(sha?{sha}:{})})}); }
    catch(e){ throw {code:e.status===401?"gh_token":e.status===403?"gh_perm":e.status===409||e.status===422?"gh_conflict":e.status===413?"too_large":"gh_error"}; }
    return "github";
  }
  const art = await claude.use("artifact");
  if(!art) throw {code:"not_granted"};
  try{
    await art.publish({"store-data.json":{content:JSON.stringify(d), contentType:"application/json"}});
    return "files";
  }catch(e){
    if(["capability_disabled","capability_removed","invalid_content","transform_error"].includes(e&&e.code)){ await art.publish(buildPage(d)); return "page"; }
    throw e;
  }
}

/* Imagen subida → JPG comprimido */
function compressImage(file, max=900, q=0.8){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=rej; r.onload=()=>{ const im=new Image(); im.onerror=rej; im.onload=()=>{
    const k=Math.min(1,max/Math.max(im.width,im.height)), c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
    const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",q)); }; im.src=r.result; }; r.readAsDataURL(file); });
}

/* ---------- Carrito ---------- */
const CartCtx = createContext(null);
const STORAGE_KEY = "sublipro-cart-v2";
function cartReducer(state, a){
  switch(a.type){
    case "add": return [...state, { ...a.item, key: Date.now()+Math.random() }];
    case "qty": return state.map(i=> i.key===a.key ? {...i, qty:Math.max(1,a.qty)} : i);
    case "remove": return state.filter(i=>i.key!==a.key);
    case "clear": return [];
    default: return state;
  }
}
function loadCart(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]; }catch(e){ return []; } }
function CartProvider({children}){
  const [items, dispatch] = useReducer(cartReducer, null, loadCart);
  const [open, setOpen] = useState(false);
  const [toast, setToast] = useState(null);
  useEffect(()=>{ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }catch(e){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(items.map(i=>({...i, thumb:null, print:null})))); }catch(_){}
  }},[items]);
  useEffect(()=>{ if(!toast) return; const t=setTimeout(()=>setToast(null),2600); return ()=>clearTimeout(t); },[toast]);
  const totals = useMemo(()=>{
    const units = items.reduce((s,i)=>s+i.qty,0), sub = items.reduce((s,i)=>s+i.qty*i.unit,0), off = bulkOff(units);
    return { units, sub, off, discount: sub*off, total: sub*(1-off) };
  },[items, DATA]);
  const add = item => { dispatch({type:"add", item}); setToast(`Agregado: ${item.name}`); };
  return html`<${CartCtx.Provider} value=${{items, dispatch, totals, open, setOpen, add, setToast}}>
    ${children}
    ${toast && html`<div class="toast" role="status">${toast}</div>`}
  <//>`;
}
const useCart = () => useContext(CartCtx);

/* Silueta sublimable de cada producto: las formas que se pintan con el color base */
const FULL_TOK="#C0FFEE";
const fullClip = type => { const A=ART[type]; if(!A) return "";
  const m=A.draw(FULL_TOK,{}).match(/<(?:path|rect|circle|ellipse|polygon)\b[^>]*\bfill="#C0FFEE"[^>]*>/gi); return m?m.join(""):""; };
const artCanCover = type => !!fullClip(type);
function designSVG(id,[x,y,w,h,r],print,pos,type){
  if(print && pos && pos.full){ const shapes=fullClip(type);
    if(shapes){ // estampado en todo el producto: la imagen cubre todo y se recorta a la silueta
      const iw=240*pos.s, ih=240*pos.s, ix=(240-iw)/2+(pos.x||0)*240, iy=(240-ih)/2+(pos.y||0)*240;
      return {defs:`<clipPath id="${id}c">${shapes}</clipPath>`, body:`<g clip-path="url(#${id}c)"><image href="${print}" x="${ix}" y="${iy}" width="${iw}" height="${ih}" preserveAspectRatio="xMidYMid slice"/></g>`};
    } }
  const clip=`<clipPath id="${id}c"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}"/></clipPath>`;
  if(print && pos){ // personalizador 2D: diseño completo, con tamaño (s) y desplazamiento (x, y en fracción del área)
    const iw=w*pos.s, ih=h*pos.s, ix=x+(w-iw)/2+(pos.x||0)*w, iy=y+(h-ih)/2+(pos.y||0)*h;
    return {defs:clip, body:`<g clip-path="url(#${id}c)"><image href="${print}" x="${ix}" y="${iy}" width="${iw}" height="${ih}" preserveAspectRatio="xMidYMid meet"/></g>`};
  }
  if(print) return {defs:clip, body:`<image href="${print}" x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="xMidYMid slice" clip-path="url(#${id}c)"/>`};
  const cx=x+w/2, cy=y+h/2, rr=Math.min(w,h)*0.36;
  return {defs:clip+`<linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B3FD8"/><stop offset="1" stop-color="#E2457A"/></linearGradient>`,
    body:`<g clip-path="url(#${id}c)"><circle cx="${cx}" cy="${cy}" r="${rr}" fill="url(#${id}g)"/><path d="M${cx-rr*.55} ${cy+rr*.35} L${cx-rr*.1} ${cy-rr*.35} L${cx+rr*.15} ${cy+rr*.05} L${cx+rr*.35} ${cy-rr*.15} L${cx+rr*.65} ${cy+rr*.35} Z" fill="#fff" opacity=".9"/><circle cx="${cx+rr*.35}" cy="${cy-rr*.45}" r="${rr*.14}" fill="#FFD166"/></g>`};
}
let artUid=0;
function artMarkup(type,{color="#FFFFFF",print,printPos,inner,thermo,pattern}={}){
  const A=ART[type]||ART.tee, id="a"+(++artUid), d=designSVG(id,A.area,print,printPos,ART[type]?type:"tee");
  const pat = pattern ? `<pattern id="${id}p" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 18 L12 6 L24 18" fill="none" stroke="#fff" stroke-width="5" opacity=".75"/></pattern>` : "";
  const body = A.draw(color,{inner,thermo});
  const patLayer = pattern && (type==="polo"||type==="tee") ? `<clipPath id="${id}k">${body.match(/<path d="[^"]+"/)[0]}/></clipPath><rect width="240" height="240" fill="url(#${id}p)" clip-path="url(#${id}k)"/>` : "";
  const over = A.shade && A.over ? A.over.replace("<path ",`<path fill="url(#${id}s)" `) : "";
  return `<svg viewBox="0 0 240 240" aria-hidden="true"><defs>${d.defs}${pat}${A.shade?shade(id):""}</defs><ellipse cx="120" cy="228" rx="70" ry="6" fill="#000" opacity=".07"/>${body}${patLayer}${pattern&&!print?"":d.body}${over}${A.top||""}</svg>`;
}
/* ¿La ilustración cambia de color? (las de vidrio, metal o piedra no) */
const artUsesColor = type => { const A=ART[type]; return !!A && A.draw("#ABC123",{}).includes("#ABC123"); };
function ProductArt(props){
  const pp = props.printPos;
  const m = useMemo(()=>artMarkup(props.type,props),[props.type,props.color,props.print,props.inner,props.thermo,props.pattern,pp&&pp.s,pp&&pp.x,pp&&pp.y,pp&&pp.full]);
  return html`<span class="art-svg" dangerouslySetInnerHTML=${{__html:m}}></span>`;
}


/* Foto con respaldo: si la imagen no carga, se muestra la ilustración */
const BROKEN = new Set();
function Photo({src, alt, fallback}){
  const [bad,setBad] = useState(BROKEN.has(src));
  useEffect(()=>{ setBad(BROKEN.has(src)); },[src]);
  if(!src || bad) return fallback;
  return html`<img class="photo" src=${src} alt=${alt||""} loading="lazy" decoding="async" referrerpolicy="no-referrer" onError=${()=>{ BROKEN.add(src); setBad(true); }}/>`;
}
function ProductMedia({p, print}){
  const art = html`<${ProductArt} type=${p.art} color=${p.color} inner=${p.inner} thermo=${p.thermo} pattern=${p.pattern} print=${print}/>`;
  if(p.photo && !print) return html`<${Photo} src=${p.photo} alt=${p.name} fallback=${art}/>`;
  return art;
}

/* ---------- Carrusel principal ---------- */
function Carousel(){
  const n=SLIDES.length;
  const [i,setI] = useState(0), [paused,setPaused] = useState(false);
  const startX=useRef(null);
  useEffect(()=>{ if(i>=n) setI(0); },[n]);
  useEffect(()=>{ if(paused || n<2 || matchMedia("(prefers-reduced-motion: reduce)").matches) return; const t=setInterval(()=>setI(v=>(v+1)%n),5500); return ()=>clearInterval(t); },[paused,n]);
  if(!n) return null;
  return html`<section class="hero wrap" aria-roledescription="carrusel" aria-label="Promociones">
    <div class="carousel" onMouseEnter=${()=>setPaused(true)} onMouseLeave=${()=>setPaused(false)}
      onTouchStart=${e=>{startX.current=e.touches[0].clientX;}} onTouchEnd=${e=>{const d=e.changedTouches[0].clientX-(startX.current||0); if(Math.abs(d)>40) setI(v=>(v+(d<0?1:-1)+n)%n);}}>
      <div class="track" style=${{transform:`translateX(-${Math.min(i,n-1)*100}%)`}}>
        ${SLIDES.map((s,k)=>html`<div class="slide" key=${k} style=${{background:`linear-gradient(115deg,${s.bg1||"#1E2638"} 30%,${s.bg2||"#2B2F7A"})`}} aria-hidden=${k!==i} role="group" aria-label=${`${k+1} de ${n}`}>
          <div class="txt">${s.kicker && html`<span class="kicker">${s.kicker}</span>`}<h1>${s.title}</h1>${s.text && html`<p>${s.text}</p>`}
            <div class="ctas">${s.cta&&s.cta[0] && html`<a class="cta" href=${"#"+s.cta[1]} tabIndex=${k===i?0:-1}>${s.cta[0]} →</a>`}${s.cta2&&s.cta2[0] && html`<a class="cta ghost" href=${"#"+s.cta2[1]} tabIndex=${k===i?0:-1}>${s.cta2[0]}</a>`}</div></div>
          <div class="art">${s.photo ? html`<img class="slide-photo" src=${s.photo} alt=""/>` : html`<${ProductArt} type=${s.art||"tee"} inner=${s.art==="mug"?"#E2457A":undefined}/>`}</div>
        </div>`)}
      </div>
      ${n>1 && html`<button class="car-btn prev" onClick=${()=>setI((i-1+n)%n)} aria-label="Anterior">‹</button>
      <button class="car-btn next" onClick=${()=>setI((i+1)%n)} aria-label="Siguiente">›</button>
      <div class="dots">${SLIDES.map((_,k)=>html`<button key=${k} aria-label=${`Ir a la promoción ${k+1}`} aria-current=${k===i} onClick=${()=>setI(k)}></button>`)}</div>`}
    </div>
  </section>`;
}

function CustomPage({p, onOpen}){
  const {add} = useCart();
  const usesColor = artUsesColor(p.art);
  const [color,setColor] = useState(()=>BASE_COLORS.find(c=>c[1].toUpperCase()===(p.color||"").toUpperCase()) || BASE_COLORS[0]);
  const [opt,setOpt] = useState(p.options&&p.options.values.length?p.options.values[0]:null);
  const [qty,setQty] = useState(1), [print,setPrint] = useState(null), [note,setNote] = useState(""), [err,setErr] = useState("");
  const canCover = artCanCover(p.art);
  const [cover,setCover] = useState(canCover);   // true: el diseño cubre todo el producto
  const start = c => ({s:c?1:0.8,x:0,y:0});
  const [pos,setPos] = useState(()=>start(canCover));
  const setMode = c => { setCover(c); setPos(start(c)); };
  const models = (p.models||[]).filter(Boolean);
  const [model,setModel] = useState(null);       // índice del modelo listo elegido (null = diseño propio)
  const cur = useRef(null);                       // modelo actual al instante (clics rápidos en las flechas)
  const useModel = i => { cur.current=i; setPrint(models[i]); setModel(i); setPos(start(cover)); setErr(""); };
  const stepModel = d => { const n=models.length; if(!n) return; const c = cur.current==null ? (d>0?-1:0) : cur.current; useModel((c+d+n)%n); };
  const onFile = async e => { const f=e.target.files[0]; e.target.value=""; if(!f) return; setErr("");
    try{ setPrint(await compressImage(f,900,0.85)); setModel(null); cur.current=null; setPos(start(cover)); }catch(_){ setErr("No se pudo leer esa imagen. Prueba con un JPG o PNG."); } };
  const unit=finalPrice(p), cat=CATEGORIES.find(c=>c.id===p.cat);
  const artProps = {type:p.art, color:usesColor?color[1]:p.color, inner:p.inner, thermo:p.thermo, print, printPos:print?{...pos,full:cover}:null};
  const addToCart = () => {
    // Como archivo de imagen, el SVG necesita xmlns (si no, el <img> del carrito sale roto)
    const svg = artMarkup(p.art, artProps).replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" ');
    const thumb = "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
    add({ id:p.id, name:p.name, unit, qty, art:p.art, color:artProps.color, inner:p.inner, thumb,
      detail:[usesColor && `Color: ${color[0]}`, opt && `${p.options.label}: ${opt}`, model!=null && print && `Modelo listo #${model+1}`, print?(cover?"diseño en todo el producto":"diseño como logo"):"diseño por WhatsApp", note && `Nota: ${note}`].filter(Boolean).join(" · ") });
  };
  const slider = (label,key,min,max,step) => html`<label class="cz-range"><span>${label}</span>
    <input type="range" min=${min} max=${max} step=${step} value=${pos[key]} onInput=${e=>setPos({...pos,[key]:+e.target.value})}/></label>`;
  return html`<div>
    <${PageHead} title=${p.name} crumb=${html`${cat?html`<a href=${"#"+cat.id}>${cat.name}</a> / `:""}Personalizar`} text=${p.desc}/>
    <section class="section wrap"><div class="cz">
      <div class="cz-stage">
        <div class="cz-view">
          ${models.length>1 && html`<button class="cz-arrow prev" onClick=${()=>stepModel(-1)} aria-label="Modelo anterior">‹</button>`}
          <div class="cz-art"><${ProductArt} ...${artProps}/></div>
          ${models.length>1 && html`<button class="cz-arrow next" onClick=${()=>stepModel(1)} aria-label="Modelo siguiente">›</button>`}
        </div>
        ${models.length>0 && html`<div class="cz-count">${model!=null&&print?`Modelo ${model+1} de ${models.length}`:`${models.length} modelo${models.length>1?"s":""} listo${models.length>1?"s":""} · usa las flechas`}</div>`}
        <small class="cz-hint">${print?"Vista previa con tu diseño. El acabado final puede variar ligeramente.":"Sube tu diseño y mira cómo queda."}</small>
        ${p.photo && html`<div class="cz-photo"><${Photo} src=${p.photo} alt=${"Foto de "+p.name} fallback=${null}/><span>Foto real del producto</span></div>`}
      </div>
      <div class="cz-panel">
        <div style=${{display:"flex",gap:8,alignItems:"center"}}><${Price} p=${p} size=${22}/>${p.discount>0 && html`<span class="tag off">−${p.discount}%</span>`}</div>
        ${usesColor && html`<div class="field">Color: <b>${color[0]}</b>
          <div class="cz-colors">${BASE_COLORS.map(c=>html`<button key=${c[1]} class="cz-sw" style=${{background:c[1]}} aria-pressed=${c[1]===color[1]} aria-label=${c[0]} title=${c[0]} onClick=${()=>setColor(c)}></button>`)}</div></div>`}
        ${models.length>0 && html`<div class="field">Modelos listos <small class="cz-sub">Toca uno para verlo en tu producto</small>
          <div class="cz-models">${models.map((m,i)=>html`<button key=${i} class="cz-model" aria-pressed=${model===i&&!!print} aria-label=${"Modelo "+(i+1)} onClick=${()=>useModel(i)}><img src=${m} alt="" loading="lazy"/><span>#${i+1}</span></button>`)}</div></div>`}
        <div class="field">${models.length?"O sube tu propio diseño":"Tu diseño"}
          <label class="drop">${print&&model==null?"Cambiar mi diseño":"Subir mi diseño (PNG / JPG, ideal 300 DPI)"}<input type="file" accept="image/*" onChange=${onFile}/></label>
          ${err && html`<small class="pay-warn">${err}</small>`}
          ${print && html`<div class="cz-adjust">
            ${canCover && html`<div class="chips" role="group" aria-label="Dónde va el diseño">
              <button aria-pressed=${cover} onClick=${()=>setMode(true)}>Todo el producto</button>
              <button aria-pressed=${!cover} onClick=${()=>setMode(false)}>Solo un logo</button></div>`}
            ${slider(cover?"Zoom":"Tamaño","s",cover?1:0.3,cover?3:1.6,0.05)}${slider("Horizontal","x",-0.5,0.5,0.02)}${slider("Vertical","y",-0.5,0.5,0.02)}
            <div style=${{display:"flex",gap:8}}><button class="btn" onClick=${()=>setPos(start(cover))}>Centrar</button><button class="btn" onClick=${()=>{ setPrint(null); setModel(null); cur.current=null; }}>Quitar diseño</button></div>
          </div>`}
        </div>
        ${p.options && p.options.values.length>0 && html`<div class="field">${p.options.label}<div class="chips">${p.options.values.map(v=>html`<button key=${v} aria-pressed=${v===opt} onClick=${()=>setOpt(v)}>${v}</button>`)}</div></div>`}
        <div class="field"><label for="note">Indicaciones (opcional)</label><textarea id="note" placeholder="Ej.: nombre en la parte de atrás, fondo azul…" value=${note} onInput=${e=>setNote(e.target.value)}></textarea></div>

        </div>
        <button class="btn primary block" onClick=${addToCart}>Agregar al carrito</button>
      </div>
    </div></section>
    ${cat && html`<section class="section wrap" style=${{paddingTop:0}}>
      <div class="sec-head"><h2>Más ${cat.name.toLowerCase()}</h2><a class="link" href=${"#"+cat.id}>Ver todo →</a></div>
      <${ProductGrid} items=${CATALOG.filter(x=>x.cat===cat.id&&x.id!==p.id).slice(0,4)} onOpen=${onOpen}/>
    </section>`}
  </div>`;

        <div class="tiers" style=${{marginTop:4}}>${[...CONFIG.bulk].sort((a,b)=>a.min-b.min).map(t=>html`<span key=${t.min} class=${"tag "+(qty>=t.min?"pink":"sky")}>${t.min}+ u. · ${t.off}% OFF</span>`)}</div>
      </div>
      <div class="box dark">
        <div style=${{display:"flex",gap:14,alignItems:"center"}}><div class="qthumb"><${ProductMedia} p=${p}/></div><div><h3 style=${{color:"#fff"}}>${p.name}</h3><span style=${{color:"#C9D2E6",fontSize:12.5}}>${qty} unidades</span></div></div>

        <div class="ln"><span>Subtotal</span><span>${money(sub)}</span></div>
        <div class="ln"><span>Descuento por volumen</span><span>${off?`−${money(sub*off)} (${Math.round(off*100)}%)`:"—"}</span></div>

        <div class="ln"><span>Precio final c/u</span><span>${money(total/qty)}</span></div>

function Field({label, children, hint}){ return html`<label class="af"><span>${label}</span>${children}${hint && html`<small>${hint}</small>`}</label>`; }
function PhotoInput({value, onChange, label="Foto"}){
  const [busy,setBusy]=useState(false), [err,setErr]=useState(""), [showUrl,setShowUrl]=useState(false), [url,setUrl]=useState("");
  const pick=async e=>{ const f=e.target.files[0]; e.target.value=""; if(!f) return; setBusy(true); setErr("");
    try{ onChange(await compressImage(f)); }catch(_){ setErr("No se pudo leer esa imagen. Prueba con un JPG o PNG."); } setBusy(false); };
  return html`<div class="af"><span>${label}</span><div class="photo-in">
    <div class="pv">${value?html`<${Photo} src=${value} fallback=${html`<small>No carga</small>`}/>`:html`<small>Sin foto</small>`}</div>
    <div style=${{display:"flex",flexDirection:"column",gap:6}}>
      <label class="btn">${busy?"Procesando…":value?"Cambiar foto":"Subir foto"}<input type="file" accept="image/*" onChange=${pick} hidden/></label>
      <button class="btn" onClick=${()=>setShowUrl(!showUrl)}>Pegar enlace</button>
      ${value && html`<button class="btn" onClick=${()=>onChange(null)}>Quitar foto</button>`}
    </div></div>
    ${showUrl && html`<div class="two"><input class="input" placeholder="https://… (enlace directo a la imagen)" value=${url} onInput=${e=>setUrl(e.target.value)}/><button class="btn" onClick=${()=>{ if(/^https:\/\/\S+$/.test(url.trim())){ onChange(url.trim()); setShowUrl(false); setUrl(""); setErr(""); } else setErr("Pega un enlace que empiece con https://"); }}>Usar enlace</button></div>`}
    ${err && html`<small class="err">${err}</small>`}</div>`;
}
/* Modelos listos: diseños ya hechos que el cliente puede elegir en la página del producto */
const MAX_MODELS=8;
function ModelsInput({value, onChange}){
  const list=value||[];
  const [busy,setBusy]=useState(false), [err,setErr]=useState("");
  const pick=async e=>{ const files=[...e.target.files]; e.target.value=""; if(!files.length) return;
    const room=MAX_MODELS-list.length; if(room<=0){ setErr(`Máximo ${MAX_MODELS} modelos por producto.`); return; }
    setBusy(true); setErr(""); const out=[];
    for(const f of files.slice(0,room)){ try{ out.push(await compressImage(f,700,0.78)); }catch(_){ setErr("Alguna imagen no se pudo leer. Prueba con JPG o PNG."); } }
    if(files.length>room) setErr(`Solo se agregaron ${room}: el máximo es ${MAX_MODELS} modelos por producto.`);
    onChange([...list,...out]); setBusy(false); };
  const move=(i,d)=>{ const n=[...list], j=i+d; if(j<0||j>=n.length) return; [n[i],n[j]]=[n[j],n[i]]; onChange(n); };
  return html`<div class="af"><span>Modelos listos (diseños ya hechos que el cliente puede elegir)</span>
    <div class="models-in">
      ${list.map((m,i)=>html`<div class="mi" key=${i}><img src=${m} alt=${"Modelo "+(i+1)}/>
        <div class="mi-acts"><button class="btn sm" onClick=${()=>move(i,-1)} disabled=${i===0} aria-label="Mover a la izquierda">←</button>
          <button class="btn danger sm" onClick=${()=>onChange(list.filter((_,k)=>k!==i))} aria-label="Quitar modelo">×</button>
          <button class="btn sm" onClick=${()=>move(i,1)} disabled=${i===list.length-1} aria-label="Mover a la derecha">→</button></div></div>`)}
      ${list.length<MAX_MODELS && html`<label class="mi add">${busy?"Procesando…":"+ Agregar fotos"}<input type="file" accept="image/*" multiple onChange=${pick} hidden/></label>`}
    </div>
    <small>${list.length}/${MAX_MODELS} · Puedes elegir varias fotos a la vez. Usa la imagen del diseño (de frente, sin fondo si es posible).</small>
    ${err && html`<small class="err">${err}</small>`}</div>`;
}
function ConfirmButton({label="Eliminar", ask="¿Eliminar?", onYes}){
  const [c,setC]=useState(false);
  return c ? html`<span class="confirm">${ask} <button class="btn danger sm" onClick=${()=>{setC(false);onYes();}}>Sí</button><button class="btn sm" onClick=${()=>setC(false)}>No</button></span>`
           : html`<button class="btn danger sm" onClick=${()=>setC(true)}>${label}</button>`;
}

function ProductsTab({d, update}){
  const [q,setQ]=useState(""), [cat,setCat]=useState("all"), [open,setOpen]=useState(null);

  const change=np=>update(x=>{ x.products=x.products.map(p=>p.id===np.id?np:p); });
  const addNew=()=>{ const id=uniqueId("producto nuevo",d.products.map(p=>p.id));

  return html`<div class="atab">

      <div class="alist">${s.bulk.map((t,i)=>html`<div class="arow" key=${i}>Desde <input class="input sm" type="number" min="1" value=${t.min} onInput=${e=>update(x=>{ x.settings.bulk[i].min=Math.max(1,parseInt(e.target.value)||1); })}/> unidades →
        <input class="input sm" type="number" min="0" max="90" value=${t.off} onInput=${e=>update(x=>{ x.settings.bulk[i].off=Math.min(90,Math.max(0,parseInt(e.target.value)||0)); })}/> % de descuento
        <${ConfirmButton} label="Quitar" ask="¿Quitar?" onYes=${()=>update(x=>{ x.settings.bulk.splice(i,1); })}/></div>`)}</div>
      <div><button class="btn sm" onClick=${()=>update(x=>{ x.settings.bulk.push({min:200,off:35}); })}>+ Agregar nivel</button></div></div>
  </div>`;
}

// Navegadores internos de apps (WhatsApp, Instagram, Facebook…): Google no permite iniciar sesión ahí
const IN_APP = /WhatsApp|Instagram|FBAN|FBAV|FB_IAB|Line\/|TikTok|; wv\)/i.test(navigator.userAgent);
function loginError(x){
  const c=x&&x.code;
  return c==="not_admin"?`La cuenta ${x.email||""} no tiene permiso de administrador.`
    :c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request"?"Cerraste la ventana de Google antes de terminar."
    :c==="auth/popup-blocked"?"El navegador bloqueó la ventana de Google. Permite ventanas emergentes para este sitio e inténtalo otra vez."
    :c==="auth/unauthorized-domain"?"Este dominio no está autorizado en Firebase (Authentication → Configuración → Dominios autorizados)."
    :c==="gis_load"?"No se pudo cargar el botón de Google. Revisa tu internet y recarga la página."
    :"No se pudo iniciar sesión. Revisa tu internet e inténtalo de nuevo.";
}
function GoogleLogin({onClose, onOk}){
  const [busy,setBusy]=useState(false), [err,setErr]=useState(""), [copied,setCopied]=useState(false);
  const gisRef=useRef(null);
  // Con ID de cliente: botón oficial de Google (funciona en celulares). Sin ID: ventana emergente de Firebase.
  useEffect(()=>{ if(IN_APP || !FB.hasGis || !gisRef.current) return;
    FB.renderButton(gisRef.current, ()=>onOk(), x=>setErr(loginError(x))).catch(x=>setErr(loginError(x))); },[]);
  const go=async()=>{ setBusy(true); setErr(""); try{ await FB.signIn(); onOk(); }catch(x){ setErr(loginError(x)); } setBusy(false); };
  const copy=async()=>{ try{ await navigator.clipboard.writeText(location.href); setCopied(true); }catch(e){ setCopied("manual"); } };
  if(IN_APP) return html`<div class="overlay" onClick=${e=>{ if(e.target===e.currentTarget) onClose(); }}>
    <div class="modal login" role="dialog" aria-modal="true" aria-label="Acceso del dueño">
      <div class="info">
        <div><span class="eyebrow">Acceso del dueño</span><h2>Abre este enlace en tu navegador</h2>
          <p class="lead">Estás dentro de WhatsApp u otra app, y ahí Google no permite iniciar sesión. Toca <b>•••</b> y elige <b>«Abrir en el navegador»</b> (Safari o Chrome), o copia el enlace y pégalo en el navegador.</p></div>
        <button class="btn primary block" onClick=${copy}>${copied===true?"Enlace copiado ✓":"Copiar enlace"}</button>
        ${copied==="manual" && html`<input class="input" readOnly value=${location.href} onFocus=${e=>e.target.select()}/>`}
        <div class="arow"><button class="btn" onClick=${onClose}>Cancelar</button></div>
      </div>
    </div></div>`;
  if(FB.hasGis) return html`<div class="overlay" onClick=${e=>{ if(e.target===e.currentTarget) onClose(); }}>
    <div class="modal login" role="dialog" aria-modal="true" aria-label="Acceso del dueño">
      <div class="info">
        <div><span class="eyebrow">Acceso del dueño</span><h2>Entrar al Panel del dueño</h2><p class="lead">Inicia sesión con la cuenta de Google autorizada. Los cambios que publiques se ven al instante en la tienda.</p></div>
        <div class="gis-wrap"><div ref=${gisRef}></div></div>
        ${err && html`<div class="amsg bad" style=${{margin:0}}>${err}</div>`}
        <div class="arow"><button class="btn" onClick=${onClose}>Cancelar</button></div>
      </div>
    </div></div>`;
  return html`<div class="overlay" onClick=${e=>{ if(e.target===e.currentTarget) onClose(); }}>
    <div class="modal login" role="dialog" aria-modal="true" aria-label="Acceso del dueño">
      <div class="info">
        <div><span class="eyebrow">Acceso del dueño</span><h2>Entrar al Panel del dueño</h2><p class="lead">Inicia sesión con la cuenta de Google autorizada. Los cambios que publiques se ven al instante en la tienda.</p></div>
        <button class="btn google" onClick=${go} disabled=${busy}>
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          ${busy?"Abriendo Google…":"Iniciar sesión con Google"}</button>
        ${err && html`<div class="amsg bad" style=${{margin:0}}>${err}</div>`}
        <div class="arow"><button class="btn" onClick=${onClose}>Cancelar</button></div>
      </div>
    </div></div>`;
}

function GitHubLogin({onClose, onOk}){
  const g=ghGuess();
  const [owner,setOwner]=useState(g.owner), [repo,setRepo]=useState(g.repo), [token,setToken]=useState(""), [busy,setBusy]=useState(false), [err,setErr]=useState("");
  const submit=async e=>{ e.preventDefault(); setBusy(true); setErr("");
    try{ const c=await ghVerify({owner:owner.trim(),repo:repo.trim(),token:token.trim()}); ghSave(c); onOk(); }
    catch(x){ setErr(x.status===401?"El token no es válido.":x.status===404?"No encuentro ese repositorio con este token. Revisa el usuario, el nombre del repositorio y que el token tenga acceso a él.":x.status===403?"El token no tiene permiso de escritura (Contents: Read and write).":"No se pudo conectar con GitHub. Revisa tu internet."); }
    setBusy(false); };
  return html`<div class="overlay" onClick=${e=>{ if(e.target===e.currentTarget) onClose(); }}>
    <form class="modal login" role="dialog" aria-modal="true" aria-label="Acceso del dueño" onSubmit=${submit}>
      <div class="info">
        <div><span class="eyebrow">Acceso del dueño</span><h2>Entrar al Panel del dueño</h2><p class="lead">Tus cambios se guardan en tu repositorio de GitHub y la tienda se actualiza para todos en 1 o 2 minutos.</p></div>
        <div class="two">
          <${Field} label="Usuario de GitHub"><input class="input" id="gh-owner" value=${owner} onInput=${e=>setOwner(e.target.value)} required/><//>
          <${Field} label="Repositorio"><input class="input" id="gh-repo" value=${repo} onInput=${e=>setRepo(e.target.value)} required/><//>
        </div>
        <${Field} label="Token de GitHub" hint="Se guarda solo en este navegador. Créalo en GitHub → Settings → Developer settings → Fine-grained tokens, con acceso a este repositorio y permiso «Contents: Read and write»."><input class="input" id="gh-token" type="password" autocomplete="off" value=${token} onInput=${e=>setToken(e.target.value)} required/><//>
        ${err && html`<div class="amsg bad" style=${{margin:0}}>${err}</div>`}
        <div class="arow"><button type="button" class="btn" onClick=${onClose}>Cancelar</button><button class="btn primary" disabled=${busy} style=${{marginLeft:"auto"}}>${busy?"Verificando…":"Entrar"}</button></div>
      </div>
    </form></div>`;
}

function AdminPanel({data, setData, saved, setSaved, onClose, onLogout}){
  const {setToast} = useCart();
  const [tab,setTab]=useState("productos"), [busy,setBusy]=useState(false), [msg,setMsg]=useState(null), [draftOffer,setDraftOffer]=useState(null);
  const dirty = JSON.stringify(data)!==JSON.stringify(saved);
  const update = fn => setData(prev=>{ const x=clone(prev); fn(x); return x; });
  useEffect(()=>{ try{ const raw=localStorage.getItem(DRAFT_KEY); if(raw){ const dr=JSON.parse(raw); if(JSON.stringify(dr.data)!==JSON.stringify(saved) && !dirty) setDraftOffer(dr); } }catch(e){} },[]);
  useEffect(()=>{ if(!dirty) return; const t=setTimeout(()=>{ try{ localStorage.setItem(DRAFT_KEY, JSON.stringify({at:Date.now(), data})); }catch(e){} },800); return ()=>clearTimeout(t); },[data]);
  useEffect(()=>{ const k=e=>{ if(e.key==="Escape") onClose(); }; addEventListener("keydown",k); return ()=>removeEventListener("keydown",k); },[]);
  const size = useMemo(()=>new Blob([JSON.stringify(data)]).size,[data]);
  const publish = async () => {
    setBusy(true); setMsg(null);
    const next={...data, updatedAt:Date.now()};
    try{ localStorage.setItem(DRAFT_KEY, JSON.stringify({at:Date.now(), data:next})); }catch(e){}
    try{
      await publishData(next);
      try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
      setData(next); setSaved(next); setMsg({ok:true,t:FB||IN_CLAUDE?"Publicado. Tus clientes ya ven los cambios.":"Guardado en GitHub. Tus clientes verán los cambios en 1 o 2 minutos."}); setToast("Cambios publicados");
    }catch(e){ setMsg({ok:false,t:PUBLISH_ERRORS[e&&e.code]||"No se pudo publicar. Inténtalo de nuevo en un momento."}); }
    setBusy(false);
  };
  const tabs=[["productos","Productos"],["categorias","Categorías"],["carrusel","Carrusel"],["ajustes","Ajustes de la tienda"]];
  return html`<div class="overlay admin-ov">
    <div class="admin" role="dialog" aria-modal="true" aria-label="Panel del dueño">
      <header class="ahdr">
        <div><h2>Panel del dueño</h2><small>${FB && FB.user() ? `Sesión: ${FB.user().email} · ` : ""}${dirty?"Tienes cambios sin publicar":FB&&FB_EMPTY?"El catálogo aún no está en Firebase":"Todo está publicado"}${FB?"":` · Datos: ${(size/1048576).toFixed(1)} MB de 12 MB`}</small></div>
        <div class="acts">
          <button class="btn" onClick=${onClose}>${dirty?"Ver vista previa":"Cerrar"}</button>
          ${onLogout && html`<button class="btn" onClick=${onLogout}>Cerrar sesión</button>`}
          <button class="btn" disabled=${!dirty||busy} onClick=${()=>{ setData(saved); try{localStorage.removeItem(DRAFT_KEY);}catch(e){} setMsg(null); }}>Descartar cambios</button>
          <button class="btn primary" disabled=${(!dirty&&!(FB&&FB_EMPTY))||busy||(!FB&&size>12582912)} onClick=${publish}>${busy?"Publicando…":FB&&FB_EMPTY&&!dirty?"Subir catálogo a Firebase":"Publicar cambios"}</button>
        </div>
      </header>
      ${draftOffer && html`<div class="amsg">Tienes un borrador sin publicar del ${new Date(draftOffer.at).toLocaleString()}.
        <button class="btn sm primary" onClick=${()=>{ setData(draftOffer.data); setDraftOffer(null); }}>Recuperar</button>
        <button class="btn sm" onClick=${()=>{ try{localStorage.removeItem(DRAFT_KEY);}catch(e){} setDraftOffer(null); }}>Descartar</button></div>`}
      ${msg && html`<div class=${"amsg "+(msg.ok?"ok":"bad")} role="status">${msg.t}</div>`}
      ${FB && FB_EMPTY && html`<div class="amsg">Tu base de datos de Firebase está vacía. Presiona <b>«Subir catálogo a Firebase»</b> para pasar todos tus productos, categorías, carrusel y ajustes. Solo se hace una vez.</div>`}
      ${!FB && size>12582912 && html`<div class="amsg bad">Las fotos ocupan demasiado espacio. Quita algunas fotos para poder publicar.</div>`}
      <nav class="atabs">${tabs.map(([k,l])=>html`<button key=${k} aria-pressed=${tab===k} onClick=${()=>setTab(k)}>${l}</button>`)}</nav>
      <div class="abody">
        ${tab==="productos" && html`<${ProductsTab} d=${data} update=${update}/>`}
        ${tab==="categorias" && html`<${CategoriesTab} d=${data} update=${update}/>`}
        ${tab==="carrusel" && html`<${SlidesTab} d=${data} update=${update}/>`}
        ${tab==="ajustes" && html`<${SettingsTab} d=${data} update=${update}/>`}
      </div>
    </div></div>`;
}


/* ---------- App ---------- */
function App(){
  const hash = useHash();
  const [data,setData] = useState(DEFAULT_DATA);       // lo que se muestra (borrador en vivo)
  const [saved,setSaved] = useState(DEFAULT_DATA);     // última versión publicada
  const [ready,setReady] = useState(false);
  const [canEdit,setCanEdit] = useState(false), [admin,setAdmin] = useState(false), [login,setLogin] = useState(false);
  const [query,setQuery] = useState("");
  useEffect(()=>{ let done=false; const t=setTimeout(()=>{ if(!done){done=true;setReady(true);} },2500);
    loadPublishedData().then(d=>{ if(done&&d===DEFAULT_DATA) return; done=true; clearTimeout(t); setData(d); setSaved(d); setReady(true); }); return ()=>clearTimeout(t); },[]);
  useEffect(()=>{ (async()=>{
    if(FB) return;
    if(IN_CLAUDE){ try{ const u=await claude.use("user"); if(u && await u.canEdit()) setCanEdit(true); }catch(e){} }
    else if(ghLoad()) setCanEdit(true);
  })(); },[]);
  const [authReady,setAuthReady] = useState(!FB);
  useEffect(()=>{ if(!FB) return; return FB.onAuth((u,adm)=>{ setCanEdit(adm); setAuthReady(true); if(!adm) setAdmin(false); }); },[]);
  useEffect(()=>{ if(hash!=="admin" || !authReady) return;
    if(FB){ if(canEdit) setAdmin(true); else setLogin(true); return; }
    if(IN_CLAUDE||ghLoad()) { if(canEdit||!IN_CLAUDE) setAdmin(true); } else setLogin(true); },[hash,canEdit,authReady]);
  applyData(data);
  const routes=[...fixedRoutes,...CATEGORIES.map(c=>c.id)];
  const custom = hash.startsWith("personalizar/") ? productById(decodeURIComponent(hash.slice(13))) : null;
  const route = custom ? custom.cat : routes.includes(hash) ? hash : "inicio";
  const onOpen = p => go(productRoute(p));
  let page;
  if(custom) page=html`<${CustomPage} key=${custom.id} p=${custom} onOpen=${onOpen}/>`;
  else if(route==="inicio") page=html`<${Home} onOpen=${onOpen}/>`;
  else if(route==="catalogo") page=html`<${CatalogPage} onOpen=${onOpen}/>`;
  else if(route==="polos") page=html`<${SimPage} key="polo" kind="polo" onOpen=${onOpen}/>`;
  else if(route==="tazas-3d") page=html`<${SimPage} key="taza" kind="taza" onOpen=${onOpen}/>`;
  else if(route==="mousepads-3d") page=html`<${SimPage} key="mousepad" kind="mousepad" onOpen=${onOpen}/>`;
  else if(route==="cotizador") page=html`<${QuotePage}/>`;
  else if(route==="buscar") page=html`<${SearchPage} query=${query} onOpen=${onOpen}/>`;
  else page=html`<${CategoryPage} cat=${route} onOpen=${onOpen}/>`;
  const dirty = JSON.stringify(data)!==JSON.stringify(saved);
  return html`<${CartProvider}>
    <${TopBar} canEdit=${canEdit} onAdmin=${()=>setAdmin(true)}/>
    <${Header} query=${query} setQuery=${setQuery}/><${Nav} route=${route}/>
    ${canEdit && dirty && !admin && html`<div class="draftbar"><div class="wrap"><span>Estás viendo un <b>borrador</b>: tus clientes aún no ven estos cambios.</span><button class="btn primary" onClick=${()=>setAdmin(true)}>Volver al panel y publicar</button></div></div>`}
    <main key=${custom?hash:route}>${page}</main>
    <${Footer}/>
    <${CartDrawer}/>
    ${admin && html`<${AdminPanel} data=${data} setData=${setData} saved=${saved} setSaved=${setSaved} onClose=${()=>{ setAdmin(false); if(location.hash==="#admin") history.replaceState(null,"",location.pathname+location.search); }} onLogout=${FB?()=>{ FB.signOut(); setAdmin(false); }:IN_CLAUDE?null:()=>{ ghSave(null); setCanEdit(false); setAdmin(false); }}/>`}
    ${login && FB && html`<${GoogleLogin} onClose=${()=>{ setLogin(false); history.replaceState(null,"",location.pathname+location.search); }} onOk=${()=>{ setLogin(false); setCanEdit(true); setAdmin(true); }}/>`}
    ${login && !FB && html`<${GitHubLogin} onClose=${()=>{ setLogin(false); history.replaceState(null,"",location.pathname+location.search); }} onOk=${()=>{ setLogin(false); setCanEdit(true); setAdmin(true); }}/>`}
  <//>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script></body></html>
